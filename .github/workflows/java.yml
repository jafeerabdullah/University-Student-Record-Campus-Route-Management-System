name: Java 17 build and tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'


    - name: Compile Java 17 sources and run regression tests
      run: sh scripts/build.sh test


    - name: Run demo smoke test
      run: |
        printf '8\n9\n0002\n15\n1\nMain Gate\n15\n2\nMain Gate\n16\n' | java -cp out Main --demo
