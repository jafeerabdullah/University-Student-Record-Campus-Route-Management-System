name: Java 17 build and tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'


    - name: Compile Java Source Files
      run: |
        mkdir -p out
        javac -d out $(find src -name "*.java")


    - name: Run Application Test
      run: |
        java -cp out Main